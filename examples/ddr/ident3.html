</style></head><body><div id="st"><div id="bg"></div>

<script src="lib/motion.js"></script><script>

// a slab = real thickness: stacked edge layers between a front and a back face
function slab(w,h,r,depth,n,front,back,edgeCls='edge'){const s=document.createElement('div');s.className='slab';s.style.width=w+'px';s.style.height=h+'px';
 for(let i=0;i<n;i++){const e=document.createElement('div');e.className=edgeCls;e.style.borderRadius=r+'px';e.style.transform=`translateZ(${-depth/2+depth*i/(n-1)}px)`;e.style.filter=`brightness(${.55+.35*Math.sin(Math.PI*i/(n-1))})`;s.appendChild(e);}
 const f=document.createElement('div');f.innerHTML=front;f.style.borderRadius=r+'px';f.style.transform=`translateZ(${depth/2+.5}px)`;f.className='fr';s.appendChild(f);
 const b=document.createElement('div');b.innerHTML=back;b.style.borderRadius=r+'px';b.style.transform=`translateZ(${-depth/2-.5}px) rotateY(180deg)`;s.appendChild(b);

const logo=slab(300,300,68,34,10,`<img src="assets/davinci_logo.png" style="width:100%;height:100%;border-radius:68px;display:block"><div class="gloss" style="border-radius:68px"></div>`,`<div class="face" style="width:100%;height:100%;border-radius:68px"></div>`);

// calendar (60-day series grid)
const cal=document.createElement('div');cal.id='cal';cal.innerHTML=`<div id="calFace"><div id="calHead"><b>Decoding DaVinci Resolve</b><span>60 DAYS</span></div><div id="grid"></div><div id="todayRing"></div></div>`;
$('cam').appendChild(cal);[120,250,380,500,630,760].forEach(x=>{const b=document.createElement('div');b.className='bind';b.style.left=x+'px';cal.appendChild(b);});
const cells=[];for(let d=1;d<=60;d++){const c=document.createElement('div');const col=(d-1)%10,row=Math.floor((d-1)/10);c.className='cell'+(d<DAY?' past':'')+(d===DAY?' today':'');c.textContent=d;c.style.left=col*84+'px';c.style.top=row*88+'px';$('grid').appendChild(c);cells.push({c,col,row,d});}

function seek(t){
 const a=t*.4;$('bg').style.background=`radial-gradient(ellipse at ${12+6*Math.sin(a)}% ${25+5*Math.cos(a)}%,#20323b77,transparent 47%),radial-gradient(ellipse at ${92-6*Math.cos(a*.8)}% ${87-5*Math.sin(a*.8)}%,#37302444,transparent 48%),#101216`;
 // camera: tilted view on the orbit, then squares up to the calendar
 const sq=tween(t,T.gather,T.cells,ease.quintInOut);
 const camRX=lerp(0,8,sq)-lerp(0,4,tween(t,T.cells,T.lift,ease.sineInOut)),camRY=lerp(-6,0,tween(t,0,T.gather,ease.sineInOut))+lerp(0,-8,sq)+lerp(0,6,tween(t,T.cells,T.lift,ease.sineInOut));
 const camZ=lerp(-260,-40,tween(t,0,T.gather,ease.sineOut))+lerp(0,-120,sq);

 // logo: the sun — rises in, slowly spins, then sinks back as the calendar forms

 const lrot=lerp(-12,12,tween(t,0,T.gather,ease.sineInOut));
 logo.style.transform=`translate3d(-150px,-150px,${lerp(0,-900,lout)}px) rotateY(${lrot+360*lout}deg) scale(${lp.s*(1-lout*.6)})`;vis(logo,lp.op*(1-tween(t,T.cal-.05,T.cal+.15)));gloss(logo,lrot*2);
 // planets: revolve around the logo on a tilted orbit and spin on their own axis
 const inK=clamp(OM.spring(Math.max(0,t-.12),.75,7));
 const gK=tween(t,T.gather,T.cal+.12,ease.quintIn);
 tiles.forEach(o=>{const th=o.ph+t*.9+gK*2.4;const R=lerp(1250,400,inK)*(1-gK);
  const x=R*Math.cos(th),y=R*Math.sin(th),z=lerp(-900,0,inK)*(1-gK);
  const spin=t*150+o.i*45+gK*300;
  o.s.style.transform=`translate3d(${x-85}px,${y-85}px,${z}px) rotateY(${spin}deg) rotateX(${12*Math.sin(t*2+o.i)}deg) scale(${lerp(1,.25,gK)})`;
  vis(o.s,clamp((t-.08-o.i*.03)/.15)*(1-tween(t,T.cal,T.cal+.12)));gloss(o.s,spin%360);});
 // title written on the spoken words
 const w0=OM.wordRise(t,T.t1-.1,{dist:40}),w1=OM.wordRise(t,T.w1,{dist:50}),w2=OM.wordRise(t,T.w2,{dist:50});
 const tOut=tween(t,T.cal,T.cells,ease.quintInOut);$('title').style.transform=`translateY(${-tOut*60}px)`;
 vis($('t1'),w0.op*(1-tOut));$('t1').style.transform=`translateY(${w0.y}px)`;const sp=$('t2').children;
 vis(sp[0],w1.op*(1-tOut));sp[0].style.transform=`translateY(${w1.y}px)`;vis(sp[1],w2.op*(1-tOut));sp[1].style.transform=`translateY(${w2.y}px)`;

 const lk=tween(t,T.lift,T.roll+.15,ease.quintInOut);
 let bx=lerp(r0.x,540,lk),by=lerp(r0.y,960,lk)-Math.sin(lk*Math.PI)*160,bw=lerp(r0.w,400,lk),bh=lerp(r0.h,400,lk),br=lerp(16,104,lk);
